
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overplast Beauty Cloud Base Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #fcfcfc;
    }
    .font-beauty {
      font-family: 'Playfair Display', serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #d4af37;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #b8860b;
    }

    @media print {
      body * {
        visibility: hidden;
      }
      #printable-invoice-area, #printable-invoice-area * {
        visibility: visible;
      }
      #printable-invoice-area {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 40px;
        background: white;
        z-index: 9999;
      }
      .no-print {
        display: none !important;
      }
      @page {
        margin: 0;
        size: auto;
      }
    }
  </style>
