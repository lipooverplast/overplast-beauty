  <script>
    // Fix for "Cannot set property fetch of #<Window> which has only a getter"
    // This happens when some libraries try to polyfill fetch in modern browsers.
    (function() {
      const originalFetch = window.fetch;
      try {
        // We use a proxy-like approach that allows setting but ignores it if it's not a function
        // or just keeps the original one if it's already working.
        let currentFetch = originalFetch;
        Object.defineProperty(window, 'fetch', {
          get: function() { return currentFetch; },
          set: function(v) { 
            if (typeof v === 'function') {
              currentFetch = v;
            } else {
              console.warn('System: Blocked invalid attempt to overwrite window.fetch');
            }
          },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        // Fallback to standard fetch if definition fails
        window.fetch = originalFetch;
      }
    })();

    // Suppress MetaMask auto-connection attempts and define robust mock if missing
    (function() {
      const noop = () => {};
      const asyncNoop = async () => [];
      
      const mockEthereum = {
        isMetaMask: true,
        isStatus: true,
        host: '',
        path: '',
        sendAsync: (payload, callback) => { if (callback) callback(null, { result: [] }); },
        send: (payload, callback) => { if (callback) callback(null, { result: [] }); return { result: [] }; },
        request: asyncNoop,
        on: noop,
        off: noop,
        once: noop,
        removeListener: noop,
        removeAllListeners: noop,
        autoRefreshOnNetworkChange: false,
        networkVersion: '1',
        selectedAddress: '0x0000000000000000000000000000000000000000',
        chainId: '0x1',
        enable: asyncNoop,
        isConnected: () => true,
        _metamask: { isUnlocked: async () => true }
      };

      try {
        if (typeof window.ethereum === 'undefined') {
          Object.defineProperty(window, 'ethereum', {
            value: mockEthereum,
            writable: false,
            configurable: false
          });
        }
        
        if (typeof window.web3 === 'undefined') {
          Object.defineProperty(window, 'web3', {
            value: { currentProvider: window.ethereum },
            writable: false,
            configurable: false
          });
        }
      } catch (e) {
        // Fallback if defineProperty fails
        window.ethereum = window.ethereum || mockEthereum;
        window.web3 = window.web3 || { currentProvider: window.ethereum };
      }

      // Persistent check to prevent overwriting
      setInterval(() => {
        if (window.ethereum && !window.ethereum.isMetaMask) {
          window.ethereum = mockEthereum;
        }
        if (window.web3 && !window.web3.currentProvider) {
          window.web3 = { currentProvider: window.ethereum };
        }
      }, 1000);
    })();

    // Global error handler to catch and silence MetaMask and Fetch connection errors
    (function() {
      const silencePatterns = [
        'MetaMask', 
        'ethereum', 
        'Failed to fetch', 
        'web3', 
        'RPC', 
        'provider', 
        'connection',
        'wallet'
      ];
      
      const shouldSilence = (msg) => {
        if (!msg) return false;
        const str = String(msg).toLowerCase();
        return silencePatterns.some(pattern => str.includes(pattern.toLowerCase()));
      };

      // Intercept all console methods
      ['error', 'warn', 'info', 'log'].forEach(method => {
        const original = console[method];
        console[method] = function() {
          const args = Array.from(arguments);
          if (args.some(arg => shouldSilence(arg))) {
            return;
          }
          original.apply(console, args);
        };
      });

      window.addEventListener('unhandledrejection', function(event) {
        if (!event.reason) return;
        const msg = String(event.reason.message || event.reason || '');
        const stack = String(event.reason.stack || '');
        if (shouldSilence(msg) || shouldSilence(stack)) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);

      window.addEventListener('error', function(event) {
        const msg = String(event.message || '');
        if (shouldSilence(msg)) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
    })();
  </script>
