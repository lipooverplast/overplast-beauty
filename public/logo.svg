<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid White Background -->
  <rect width="800" height="500" fill="#ffffff"/>
  
  <!-- Golden Icon (Silhouette and Crescent) -->
  <g transform="translate(400, 180)">
    <!-- The Crescent/Halo -->
    <path d="M-80,20 C-110,-20 -110,-80 -80,-120 M80,20 C110,-20 110,-80 80,-120" fill="none" stroke="#FFD700" stroke-width="5" stroke-linecap="round"/>
    <path d="M-60,40 C-90,0 -90,-100 -60,-140 M60,40 C90,0 90,-100 60,-140" fill="none" stroke="#FFD700" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    
    <!-- The Silhouette (Artistic Brush Style) -->
    <path d="M0,-160 
             C-5,-140 -10,-120 -12,-100 
             C-15,-70 -10,-40 -5,-10 
             C-2,20 -1,50 0,100 
             C1,50 2,20 5,-10 
             C10,-40 15,-70 12,-100 
             C10,-120 5,-140 0,-160" fill="#FFD700"/>
    
    <!-- Head and Arm Detail -->
    <circle cx="0" cy="-165" r="8" fill="#FFD700"/>
    <path d="M-20,-130 C-35,-150 -25,-175 0,-165" fill="none" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Horizontal Lines -->
  <line x1="100" y1="330" x2="300" y2="330" stroke="#000000" stroke-width="3"/>
  <line x1="500" y1="330" x2="700" y2="330" stroke="#000000" stroke-width="3"/>
  
  <!-- Main Text: OVER PLAST -->
  <text x="400" y="345" font-family="Arial, sans-serif" font-weight="900" font-size="60" fill="#000000" text-anchor="middle" letter-spacing="4">OVER | PLAST</text>
  
  <!-- Subtext: Beauty (Script Style) -->
  <text x="400" y="430" font-family="'Brush Script MT', cursive, serif" font-size="90" fill="#000000" text-anchor="middle">Beauty</text>
</svg>
